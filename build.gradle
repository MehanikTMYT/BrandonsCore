plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.brandon3055'
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenLocal()
    maven { url "https://maven.covers1624.net/" }
}

dependencies {
    implementation files('../CodeChickenLib/build/libs/codechickenlib-4.7.0+26.1.2-port.1.jar')
}

neoForge {
    version = neo_version
    mods {
        brandonscore {
            sourceSet sourceSets.main
        }
    }
}

// Manually ensure minecraft is included? No, this shouldn't be needed with moddev plugin.
// Let's try to add the runs configuration as in CodeChickenLib, maybe that's what triggers the setup?
neoForge {
    runs {
        configureEach {
            sourceSet = sourceSets.main
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs << "-Xmaxerrs" << "1000" }
