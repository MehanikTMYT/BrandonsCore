plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.brandon3055'
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenLocal()
    maven { url "https://maven.covers1624.net/" }
}

dependencies {
    implementation 'net.covers1624:Quack:0.4.10.130'
    implementation files('../CodeChickenLib/build/libs/codechickenlib-4.7.0+26.1.2-port.2.jar')
}

neoForge {
    version = neo_version
    mods {
        brandonscore {
            sourceSet sourceSets.main
        }
    }
}

// Explicit dev runs: the mod source set above is part of both launches.
neoForge {
    runs {
        server {
            server()
            gameDirectory = project.file("run/server")
            programArgument("--nogui")
        }
        client {
            client()
            gameDirectory = project.file("run/client")
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString(), '--width', '1280', '--height', '720')
            }
        }
    }
}

processResources {
    def values = [mod_version: project.version, loader_version_range: loader_version_range,
        neo_version_range: neo_version_range, minecraft_version_range: minecraft_version_range]
    inputs.properties(values)
    filesMatching('META-INF/neoforge.mods.toml') { expand(values) }
}
jar {
    manifest { attributes('MixinConfigs': 'mixins.brandonscore.json', 'Implementation-Version': project.version) }
    from('LICENSE.md', 'LICENSE-CCL', 'CCL-GUI-NOTICE.md')
}
